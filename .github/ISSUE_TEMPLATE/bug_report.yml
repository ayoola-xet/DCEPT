name: Defect report
description: Report a reproducible DCEPT defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, or private endpoint URLs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Give the DCEPT version or commit hash.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest safe scenario and command that reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Give the operating system, Rust or Node.js version, and target type.
    validations:
      required: true

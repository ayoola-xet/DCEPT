name: Feature request
description: Propose a focused DCEPT change.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the compatibility-testing problem.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: State the behavior that you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List other solutions that you considered.

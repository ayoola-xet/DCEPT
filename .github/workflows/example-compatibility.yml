name: Example compatibility check

on:
  workflow_dispatch:
    inputs:
      baseline_url:
        required: true
        type: string
      candidate_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./actions/dcept
        with:
          scenario: examples/transfer-to-fresh-address.yaml
          baseline-url: ${{ inputs.baseline_url }}
          candidate-url: ${{ inputs.candidate_url }}

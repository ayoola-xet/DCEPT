name: Example compatibility check

on:
  workflow_dispatch:
    inputs:
      baseline_url:
        required: true
        type: string
      candidate_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/dcept
        with:
          scenario: examples/transfer-to-fresh-address.yaml
          baseline-url: ${{ inputs.baseline_url }}
          candidate-url: ${{ inputs.candidate_url }}

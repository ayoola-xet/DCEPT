name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: node scripts/verify-local-run.mjs
      - run: node scripts/verify-glamsterdam-probes.mjs
      - run: node scripts/verify-action-report.mjs
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: ./scripts/build-wasm.sh
      - run: node scripts/verify-wasm-core.mjs
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run verify:probes
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:wasm-trace
  adapters:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapters/package-lock.json
      - run: npm ci
      - run: npm run check

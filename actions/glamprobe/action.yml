name: GlamProbe compatibility check
description: Run one GlamProbe YAML scenario in GitHub Actions and annotate findings.
inputs:
  scenario:
    description: Path to the YAML scenario.
    required: true
  command:
    description: CLI command. Use run for one case or fuzz for the YAML fuzz block.
    required: false
    default: run
  cases:
    description: Optional fuzz case count override. Applies only when command is fuzz.
    required: false
    default: ""
  seed:
    description: Optional deterministic fuzz seed override. Applies only when command is fuzz.
    required: false
    default: ""
  baseline-url:
    description: Baseline JSON-RPC endpoint URL.
    required: true
  candidate-url:
    description: Candidate JSON-RPC endpoint URL.
    required: true
  baseline-headers:
    description: Optional newline-separated NAME:VALUE headers.
    required: false
    default: ""
  candidate-headers:
    description: Optional newline-separated NAME:VALUE headers.
    required: false
    default: ""
  variables:
    description: Optional newline-separated NAME=VALUE scenario inputs.
    required: false
    default: ""
  variable-files:
    description: Optional newline-separated NAME=PATH JSON scenario inputs.
    required: false
    default: ""
  report-path:
    description: Path for the JSON report.
    required: false
    default: glamprobe-report.json
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - id: run
      shell: bash
      env:
        BASELINE_HEADERS: ${{ inputs.baseline-headers }}
        CANDIDATE_HEADERS: ${{ inputs.candidate-headers }}
        VARIABLES: ${{ inputs.variables }}
        VARIABLE_FILES: ${{ inputs.variable-files }}
        COMMAND: ${{ inputs.command }}
        CASES: ${{ inputs.cases }}
        SEED: ${{ inputs.seed }}
      run: |
        baseline_args=()
        candidate_args=()
        variable_args=()
        while IFS= read -r header; do
          [ -z "$header" ] || baseline_args+=(--baseline-header "$header")
        done <<< "$BASELINE_HEADERS"
        while IFS= read -r header; do
          [ -z "$header" ] || candidate_args+=(--candidate-header "$header")
        done <<< "$CANDIDATE_HEADERS"
        while IFS= read -r variable; do
          [ -z "$variable" ] || variable_args+=(--var "$variable")
        done <<< "$VARIABLES"
        while IFS= read -r variable_file; do
          [ -z "$variable_file" ] || variable_args+=(--var-file "$variable_file")
        done <<< "$VARIABLE_FILES"
        case "$COMMAND" in
          run) command_args=(run "${{ inputs.scenario }}") ;;
          fuzz)
            command_args=(fuzz "${{ inputs.scenario }}")
            [ -z "$CASES" ] || command_args+=(--cases "$CASES")
            [ -z "$SEED" ] || command_args+=(--seed "$SEED")
            ;;
          *) echo "command must be run or fuzz" >&2; exit 1 ;;
        esac
        set +e
        cargo run --manifest-path "$GITHUB_ACTION_PATH/../../Cargo.toml" -- "${command_args[@]}" \
          --baseline-url "${{ inputs.baseline-url }}" \
          --candidate-url "${{ inputs.candidate-url }}" \
          --output "${{ inputs.report-path }}" \
          "${variable_args[@]}" \
          "${baseline_args[@]}" "${candidate_args[@]}"
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - if: steps.run.outputs.status == '0' || steps.run.outputs.status == '2'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/report.mjs" "${{ inputs.report-path }}"
    - if: steps.run.outputs.status != '0'
      shell: bash
      run: exit "${{ steps.run.outputs.status }}"

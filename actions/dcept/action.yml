name: DCEPT compatibility check
description: Run one DCEPT YAML scenario in GitHub Actions and annotate findings.
inputs:
  scenario:
    description: Path to the YAML scenario.
    required: true
  command:
    description: CLI command. Use run for one case or fuzz for the YAML fuzz block.
    required: false
    default: run
  cases:
    description: Optional fuzz case count override. Applies only when command is fuzz.
    required: false
    default: ""
  seed:
    description: Optional deterministic fuzz seed override. Applies only when command is fuzz.
    required: false
    default: ""
  baseline-url:
    description: Baseline JSON-RPC endpoint URL.
    required: true
  candidate-url:
    description: Candidate JSON-RPC endpoint URL.
    required: true
  comparison-mode:
    description: Product purpose. Use upgrade-differential, client-differential, or control.
    required: false
    default: upgrade-differential
  baseline-protocol:
    description: Baseline protocol or fork identity.
    required: false
    default: ""
  candidate-protocol:
    description: Candidate protocol or fork identity.
    required: false
    default: ""
  baseline-client:
    description: Baseline client identity.
    required: false
    default: ""
  candidate-client:
    description: Candidate client identity.
    required: false
    default: ""
  baseline-state-fingerprint:
    description: Baseline deterministic starting-state fingerprint.
    required: false
    default: ""
  candidate-state-fingerprint:
    description: Candidate deterministic starting-state fingerprint.
    required: false
    default: ""
  control-reason:
    description: Required reason for control mode.
    required: false
    default: ""
  historical-fork-boundary:
    description: Set to true only for an explicit historical fork-boundary probe.
    required: false
    default: "false"
  allow-mode-override:
    description: Set to true to override mode identity protection.
    required: false
    default: "false"
  mode-override-reason:
    description: Required reason for a mode identity override.
    required: false
    default: ""
  baseline-headers:
    description: Optional newline-separated NAME:VALUE headers.
    required: false
    default: ""
  candidate-headers:
    description: Optional newline-separated NAME:VALUE headers.
    required: false
    default: ""
  variables:
    description: Optional newline-separated NAME=VALUE scenario inputs.
    required: false
    default: ""
  variable-files:
    description: Optional newline-separated NAME=PATH JSON scenario inputs.
    required: false
    default: ""
  report-path:
    description: Path for the JSON report.
    required: false
    default: dcept-report.json
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
    - id: run
      shell: bash
      env:
        BASELINE_HEADERS: ${{ inputs.baseline-headers }}
        CANDIDATE_HEADERS: ${{ inputs.candidate-headers }}
        VARIABLES: ${{ inputs.variables }}
        VARIABLE_FILES: ${{ inputs.variable-files }}
        COMMAND: ${{ inputs.command }}
        CASES: ${{ inputs.cases }}
        SEED: ${{ inputs.seed }}
        COMPARISON_MODE: ${{ inputs.comparison-mode }}
        BASELINE_PROTOCOL: ${{ inputs.baseline-protocol }}
        CANDIDATE_PROTOCOL: ${{ inputs.candidate-protocol }}
        BASELINE_CLIENT: ${{ inputs.baseline-client }}
        CANDIDATE_CLIENT: ${{ inputs.candidate-client }}
        BASELINE_STATE_FINGERPRINT: ${{ inputs.baseline-state-fingerprint }}
        CANDIDATE_STATE_FINGERPRINT: ${{ inputs.candidate-state-fingerprint }}
        CONTROL_REASON: ${{ inputs.control-reason }}
        HISTORICAL_FORK_BOUNDARY: ${{ inputs.historical-fork-boundary }}
        ALLOW_MODE_OVERRIDE: ${{ inputs.allow-mode-override }}
        MODE_OVERRIDE_REASON: ${{ inputs.mode-override-reason }}
        SCENARIO: ${{ inputs.scenario }}
        BASELINE_URL: ${{ inputs.baseline-url }}
        CANDIDATE_URL: ${{ inputs.candidate-url }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        baseline_args=()
        candidate_args=()
        variable_args=()
        mode_args=(--mode "$COMPARISON_MODE")
        [ -z "$BASELINE_PROTOCOL" ] || mode_args+=(--baseline-protocol "$BASELINE_PROTOCOL")
        [ -z "$CANDIDATE_PROTOCOL" ] || mode_args+=(--candidate-protocol "$CANDIDATE_PROTOCOL")
        [ -z "$BASELINE_CLIENT" ] || mode_args+=(--baseline-client "$BASELINE_CLIENT")
        [ -z "$CANDIDATE_CLIENT" ] || mode_args+=(--candidate-client "$CANDIDATE_CLIENT")
        [ -z "$BASELINE_STATE_FINGERPRINT" ] || mode_args+=(--baseline-state-fingerprint "$BASELINE_STATE_FINGERPRINT")
        [ -z "$CANDIDATE_STATE_FINGERPRINT" ] || mode_args+=(--candidate-state-fingerprint "$CANDIDATE_STATE_FINGERPRINT")
        [ -z "$CONTROL_REASON" ] || mode_args+=(--control-reason "$CONTROL_REASON")
        [ "$HISTORICAL_FORK_BOUNDARY" != "true" ] || mode_args+=(--historical-fork-boundary)
        [ "$ALLOW_MODE_OVERRIDE" != "true" ] || mode_args+=(--allow-mode-override)
        [ -z "$MODE_OVERRIDE_REASON" ] || mode_args+=(--mode-override-reason "$MODE_OVERRIDE_REASON")
        while IFS= read -r header; do
          [ -z "$header" ] || baseline_args+=(--baseline-header "$header")
        done <<< "$BASELINE_HEADERS"
        while IFS= read -r header; do
          [ -z "$header" ] || candidate_args+=(--candidate-header "$header")
        done <<< "$CANDIDATE_HEADERS"
        while IFS= read -r variable; do
          [ -z "$variable" ] || variable_args+=(--var "$variable")
        done <<< "$VARIABLES"
        while IFS= read -r variable_file; do
          [ -z "$variable_file" ] || variable_args+=(--var-file "$variable_file")
        done <<< "$VARIABLE_FILES"
        case "$COMMAND" in
          run) command_args=(run "$SCENARIO") ;;
          fuzz)
            command_args=(fuzz "$SCENARIO")
            [ -z "$CASES" ] || command_args+=(--cases "$CASES")
            [ -z "$SEED" ] || command_args+=(--seed "$SEED")
            ;;
          *) echo "command must be run or fuzz" >&2; exit 1 ;;
        esac
        set +e
        cargo run --manifest-path "$GITHUB_ACTION_PATH/../../Cargo.toml" -- "${command_args[@]}" \
          --baseline-url "$BASELINE_URL" \
          --candidate-url "$CANDIDATE_URL" \
          --output "$REPORT_PATH" \
          "${mode_args[@]}" \
          "${variable_args[@]}" \
          "${baseline_args[@]}" "${candidate_args[@]}"
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - if: steps.run.outputs.status == '0' || steps.run.outputs.status == '2'
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
      run: node "$GITHUB_ACTION_PATH/report.mjs" "$REPORT_PATH"
    - if: steps.run.outputs.status != '0'
      shell: bash
      run: exit "${{ steps.run.outputs.status }}"
